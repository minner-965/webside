services:
  - type: web
    name: aster-wellness-store
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: APP_BASE_URL
        value: https://www.sexwomen.mom
      - key: API_BASE_URL
        value: https://www.sexwomen.mom
      - key: DATABASE_URL
        sync: false
      - key: STORE_BACKEND
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: STOREFRONT_HOST
        value: www.sexwomen.mom
      - key: ADMIN_HOST
        value: admin.sexwomen.mom
      - key: APEX_HOST
        value: sexwomen.mom
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: STORE_DATA_PATH
        value: /opt/render/project/src/data/store.json
    disk:
      name: store-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
