services:
  - type: web
    name: aster-wellness-store
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: APP_BASE_URL
        value: https://www.sexwomen.mom
      - key: API_BASE_URL
        value: https://www.sexwomen.mom
      - key: FLW_SECRET_KEY
        value: 你的Flutterwave密钥
      - key: RESEND_API_KEY
        value: 你的Resend密钥
      - key: ORDER_FROM_EMAIL
        value: orders@sexwomen.mom
      - key: SUPPORT_EMAIL
        value: support@sexwomen.mom
      - key: ADMIN_EMAIL
        value: ops@sexwomen.mom
      - key: STORE_DATA_PATH
        value: /opt/render/project/src/data/store.json
    disk:
      name: store-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

SUPPORT_EMAIL=support@sexwomen.mom
ADMIN_EMAIL=ops@sexwomen.mom
